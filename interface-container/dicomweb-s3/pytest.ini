[pytest]
# Run from the container directory: python3 -m pytest
# tests/conftest.py puts this directory on sys.path and installs the pymysql /
# boto3 stubs before any service module is imported, so the whole suite runs
# without MySQL, without AWS and without network.
testpaths = tests
python_files = test_*.py
# No -q here: the README documents `python3 -m pytest tests/ -q`, and a -q in
# addopts makes that invocation -qq, which suppresses the pass/fail totals line -
# the one thing the reader is running it for.
addopts = --strict-markers -p no:cacheprovider
filterwarnings =
    # pydicom 3 deprecates several 2.x spellings the service still uses via
    # highdicom; a DeprecationWarning must not fail a tenancy test.
    default::DeprecationWarning
