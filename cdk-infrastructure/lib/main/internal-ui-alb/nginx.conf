# nginx config for the in-VPC internal UI front door. Ports the SPA-routing logic from
# the CloudFront Function in ui-hosting-stack.ts (handler()), the baseline security headers
# from the CloudFront ResponseHeadersPolicy, and proxies /dicomweb/* to the DICOMweb service
# ALB (replacing the CloudFront VPC-origin behavior). DICOMWEB_UPSTREAM_PLACEHOLDER is
# rewritten by entrypoint.sh at container start from the DICOMWEB_UPSTREAM env var that the
# task definition sets (InternalUiFrontDoor.setDicomWebUpstream); it is never baked in.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  # STOW-RS / multipart bodies (CloudFront imposed no small cap either).
  client_max_body_size 0;

  # Amazon-provided VPC DNS. The DICOMweb ALB's IPs change over time, so the upstream is
  # resolved per request (proxy_pass with a variable) rather than once at startup.
  resolver 169.254.169.253 valid=30s ipv6=off;

  # Baseline security headers (mirror of the CloudFront ResponseHeadersPolicy).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'self' blob:; base-uri 'self'" always;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Behind the ALB (TLS terminates on :443, forwards to this container on :8080).
    # Emit RELATIVE Location headers so a `return 302 /admin/` keeps the browser's
    # original scheme+host+port (https://myarchive.internal.test/...) instead of nginx
    # synthesizing an absolute URL with its own listen port -> the ":8080" leak on
    # /admin and /data-user redirects. port_in_redirect off is belt-and-suspenders
    # for any absolute redirect nginx still builds internally.
    absolute_redirect off;
    port_in_redirect off;

    # ALB health check.
    location = /healthz { access_log off; return 200 'ok'; }

    # Root -> /admin/ (CloudFront Function: uri === '/').
    location = / { return 302 /admin/; }

    # Bare app prefix (CloudFront Function: uri === prefix -> the app's index).
    location ~ ^/(admin|data-user|ohif|slim|volview)$ { return 302 /$1/; }

    # /dicom-microscopy-viewer/* -> /ohif/dicom-microscopy-viewer/*
    location /dicom-microscopy-viewer/ {
      rewrite ^/(.*)$ /ohif/$1 last;
    }

    # OHIF: the ONNX wasm loader resolves files relative to the page URL, so a nested
    # .../ort/<file> or .../assets/<file> is served from /ohif/ort/ or /ohif/assets/.
    location ~ "^/ohif/.+?/(ort|assets)/(.+\.[^/]+)$" {
      try_files /ohif/$1/$2 =404;
    }

    # Static passthrough paths (CloudFront Function: /installers/, /CHANGELOG).
    location /installers/ { try_files $uri =404; }
    location /CHANGELOG   { try_files $uri =404; }

    # Per-app SPA routing. Each app serves its own index.html for non-asset routes.
    # SLIM: /slim/studies/* is always a SPA route (DICOM UIDs contain dots, so the
    # "has a file extension" heuristic would misfire).
    location /slim/studies/ { try_files /slim/index.html =404; }

    # admin / data-user / ohif / slim / volview: asset-or-index fallback.
    # try_files serves the file if it exists (static asset), else the app index.html.
    location /admin/      { try_files $uri $uri/ /admin/index.html; }
    location /data-user/  { try_files $uri $uri/ /data-user/index.html; }
    location /ohif/       { try_files $uri $uri/ /ohif/index.html; }
    location /slim/       { try_files $uri $uri/ /slim/index.html; }
    location /volview/    { try_files $uri $uri/ /volview/index.html; }

    # DICOMweb data plane -> DICOMweb service ALB (replaces the CloudFront VPC-origin
    # behavior). No caching (PHI). The request URI is passed through unchanged.
    location /dicomweb/ {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      # Same as CloudFront's ALL_VIEWER_EXCEPT_HOST_HEADER: Host becomes the upstream's.
      # X-Forwarded-For is passed through as the front-door ALB built it (client IP), NOT
      # appended to, so the DICOMweb ALB's append yields the same 2-hop shape the container's
      # TRUSTED_PROXY_HOPS=2 expects (it was CloudFront + ALB; now front-door ALB + ALB).
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      set $dicomweb_upstream DICOMWEB_UPSTREAM_PLACEHOLDER;
      proxy_pass $dicomweb_upstream;
    }

    # Unknown path -> 404 (CloudFront Function default).
    location / { return 404; }
  }
}
